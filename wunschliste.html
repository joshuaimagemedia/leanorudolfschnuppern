<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wunschliste – Amazing Rudolf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="logo-1.png" class="logo-img" alt="Rudolf Logo">
    <span class="nav-brand">Amazing<br><b>Rudolf</b></span>
  </a>
  <div class="nav-links">
    <a href="neu.html">Neu im Sortiment</a>
    <a href="index.html#infos">Infos</a>
    <a href="shop.html">SHOP</a>
    <a href="wunschliste.html" class="active">Wunschliste ♥</a>
    <button class="nav-cart-btn" onclick="openCart()">🛒<span class="cart-badge" id="cb1"></span></button>
  </div>
</nav>

<div class="neu-banner" style="background:var(--or)">
  <h1 style="color:#fff;text-shadow:4px 4px 0 var(--bk)">Wunschliste ♥</h1>
  <p style="color:rgba(255,255,255,.8)">Deine gespeicherten Produkte</p>
</div>

<div class="container" style="padding:48px 24px 80px" id="wish-container">
  <!-- filled by JS -->
</div>

<footer>
  <strong>Amazing Rudolf</strong> – Pokémon Karten Shop · 2026 · Schnupperpraktikum Leano Rudolf
</footer>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-head"><h2>Warenkorb 🛒</h2><button onclick="closeCart()">✕</button></div>
  <div class="cart-list" id="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-total-row"><span>Gesamt</span><span id="cart-total">0 CHF</span></div>
    <button class="btn-checkout" onclick="showToast('🚧 Checkout kommt bald!')">Zur Kasse →</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="shop.js"></script>
<script>
const ALL_PRODUCTS = [
  {id:1, name:'Reshiram & Charizard GX Tag Team', price:68, emoji:'🔥', bg:'linear-gradient(135deg,#ff4400,#cc2200)'},
  {id:2, name:'Greninja EX SAR', price:176, emoji:'💧', bg:'linear-gradient(135deg,#0055cc,#003399)'},
  {id:3, name:'Mega Rayquaza EX SAR', price:170, emoji:'🌟', bg:'linear-gradient(135deg,#8800dd,#5500aa)'},
  {id:4, name:'30th Anniversary Pack', price:13, emoji:'🎁', bg:'linear-gradient(135deg,#ddaa00,#aa7700)'},
  {id:5, name:'30th Anniversary Top Trainer Box', price:249, emoji:'📦', bg:'linear-gradient(135deg,#ddaa00,#996600)'},
  {id:6, name:'30th Anniversary Ditto Premium Collection', price:105, emoji:'⭐', bg:'linear-gradient(135deg,#ddaa00,#aa7700)'},
  {id:7, name:'30th Anniversary Greninja Tin Box', price:55, emoji:'🥷', bg:'linear-gradient(135deg,#ddaa00,#996600)'},
  {id:8, name:'Storm Emeralda Elite Trainer Box', price:2100, emoji:'🌿', bg:'linear-gradient(135deg,#226622,#114411)'},
  {id:9, name:'Storm Emeralda Display', price:99, emoji:'📋', bg:'linear-gradient(135deg,#226622,#114411)'},
  {id:10, name:'Storm Emeralda Pack', price:13, emoji:'🃏', bg:'linear-gradient(135deg,#226622,#114411)'},
  {id:11, name:'1999 German Base Set Pikachu', price:4500, emoji:'⚡', bg:'linear-gradient(135deg,#cc8800,#885500)'},
  {id:12, name:'1999 English Base Set Venusaur', price:33300, emoji:'🌱', bg:'linear-gradient(135deg,#227722,#115511)'},
  {id:13, name:'1996 Japanese Base Set Charizard', price:35000, emoji:'🔥', bg:'linear-gradient(135deg,#cc2200,#881100)'},
  {id:14, name:'Kartensleeves (100 Stück)', price:6.9, emoji:'🎴', bg:'linear-gradient(135deg,#222,#111)'},
  {id:15, name:'Pikachu Deckbox', price:7.9, emoji:'📦', bg:'linear-gradient(135deg,#f0c040,#d49a00)'},
];

function formatPrice(p) {
  return p.toLocaleString('de-CH') + ' CHF';
}

function renderWishlist() {
  const wl = getWishlist();
  const container = document.getElementById('wish-container');
  container.textContent = '';
  const items = ALL_PRODUCTS.filter(function(p){ return wl.includes(p.id); });
  if (items.length === 0) {
    const div = document.createElement('div');
    div.className = 'wish-empty';
    const p = document.createElement('p');
    p.textContent = 'Deine Wunschliste ist noch leer.';
    const br = document.createElement('br');
    const a = document.createElement('a');
    a.href = 'shop.html';
    a.textContent = 'Jetzt im Shop stöbern →';
    div.appendChild(p);
    div.appendChild(br);
    div.appendChild(a);
    container.appendChild(div);
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid-4';
  items.forEach(function(p) {
    const card = document.createElement('div');
    card.className = 'card';

    const imgDiv = document.createElement('div');
    imgDiv.className = 'card-img';
    imgDiv.style.background = p.bg;

    const emoji = document.createElement('span');
    emoji.className = 'card-emoji';
    emoji.textContent = p.emoji;

    const wishBtn = document.createElement('button');
    wishBtn.className = 'wish-btn active';
    wishBtn.dataset.id = p.id;
    wishBtn.textContent = '❤️';
    wishBtn.onclick = function() {
      toggleWishlist(p.id);
      renderWishlist();
    };

    imgDiv.appendChild(emoji);
    imgDiv.appendChild(wishBtn);

    const body = document.createElement('div');
    body.className = 'card-body';

    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = p.name;

    const price = document.createElement('div');
    price.className = 'card-price';
    price.textContent = formatPrice(p.price);

    const btn = document.createElement('button');
    btn.className = 'btn-buy';
    btn.textContent = 'In den Warenkorb';
    btn.onclick = function() { addToCart(p.id, p.name, p.price, p.emoji); };

    body.appendChild(name);
    body.appendChild(price);
    body.appendChild(btn);

    card.appendChild(imgDiv);
    card.appendChild(body);
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

document.addEventListener('DOMContentLoaded', renderWishlist);
</script>
</body>
</html>
